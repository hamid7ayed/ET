    batch.set(ref, { ...item, createdAt: new Date().toISOString() });
    count++;
    // Firestore batch limit is 500
    if (count % 490 === 0) {
      await batch.commit();
      log('  Batch committed (' + count + ')');
    }
  }
  await batch.commit();
  log('  ✓ ' + items.length + ' ' + name + ' imported', 'ok');
}

document.getElementById('btn-import').addEventListener('click', async () => {
  const btn = document.getElementById('btn-import');
  btn.disabled = true;
  btn.textContent = 'Importing...';
  document.getElementById('log').textContent = 'Starting import...\n';

  try {
    setProgress(10);
    await importCollection('sites', DATA.sites, 'name');
    setProgress(25);

    await importCollection('users', DATA.users, 'username');
    setProgress(45);

    await importCollection('employees', DATA.employees, 'name');
    setProgress(70);

    await importCollection('transactions', DATA.transactions, 'type');
    setProgress(100);

    log('\n✅ IMPORT COMPLETE!', 'ok');
    log('Users: ' + DATA.users.length, 'ok');
    log('Sites: ' + DATA.sites.length, 'ok');
    log('Employees: ' + DATA.employees.length, 'ok');
    log('Transactions: ' + DATA.transactions.length, 'ok');
    log('\nYou can now login to the main app!', 'ok');
    btn.textContent = '✅ Done!';
    document.getElementById('btn-clear').style.display = 'block';
  } catch(e) {
    log('\n❌ ERROR: ' + e.message, 'err');
    console.error(e);
    btn.disabled = false;
    btn.textContent = 'Retry Import';
  }
});

document.getElementById('btn-clear').addEventListener('click', async () => {
  if (!confirm('This will DELETE all data from Firestore. Are you sure?')) return;
  const cols = ['users','sites','employees','transactions','carryForward'];
  for (const col of cols) {
    const snap = await getDocs(collection(db, col));
    const batch = writeBatch(db);
    snap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
    log('Cleared ' + col, 'err');
  }
  log('All data cleared.', 'err');
});
</script>
