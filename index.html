<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>پينک — در حال انتقال...</title>

  <!-- Auto redirect after 3 seconds -->
  <meta http-equiv="refresh" content="3;url=https://penak-7f61b.web.app">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0f0f1a;
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 16px; display: block; }
    h1 { font-size: 28px; font-weight: 900; color: #eaeaea; margin-bottom: 8px; }
    .subtitle { color: #8892a4; font-size: 14px; margin-bottom: 32px; line-height: 1.6; }
    .new-link {
      display: block;
      background: linear-gradient(135deg, #e94560, #c0392b);
      color: white;
      text-decoration: none;
      border-radius: 14px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      transition: opacity .2s;
    }
    .new-link:active { opacity: 0.85; }
    .countdown {
      font-size: 13px;
      color: #8892a4;
      margin-top: 20px;
    }
    .countdown span {
      color: #f5a623;
      font-weight: 700;
      font-size: 16px;
    }
    .progress {
      background: rgba(255,255,255,0.08);
      border-radius: 6px;
      height: 4px;
      margin-top: 16px;
      overflow: hidden;
    }
    .progress-bar {
      background: linear-gradient(90deg, #e94560, #f5a623);
      height: 100%;
      width: 0%;
      border-radius: 6px;
      animation: fill 3s linear forwards;
    }
    @keyframes fill {
      from { width: 0%; }
      to   { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🃏</span>
    <h1>پينک</h1>
    <p class="subtitle">
      اپلیکیشن پينک به آدرس جدید منتقل شده است.<br>
      <br>
      The Penak app has moved to a new address.
    </p>

    <a href="https://penak-7f61b.web.app" class="new-link">
      🚀 رفتن به پينک جدید<br>
      <span style="font-size:12px; opacity:.8;">penak-7f61b.web.app</span>
    </a>

    <div class="countdown">
      انتقال خودکار در <span id="sec">3</span> ثانیه...<br>
      Auto-redirecting in <span id="sec2">3</span> seconds...
    </div>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>
  </div>

  <script>
    const NEW_URL = 'https://penak-7f61b.web.app';
    let count = 3;

    const timer = setInterval(() => {
      count--;
      document.getElementById('sec').textContent  = count;
      document.getElementById('sec2').textContent = count;
      if (count <= 0) {
        clearInterval(timer);
        window.location.href = NEW_URL;
      }
    }, 1000);

    // If PWA — redirect immediately after short delay
    if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
      setTimeout(() => { window.location.href = NEW_URL; }, 500);
    }
  </script>
</body>
</html>
