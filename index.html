<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#0f1117"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="سلف"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>متتبع السلف | Employee Tracker</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f1117;--sur:#1a1d27;--sur2:#22263a;--bdr:#2e3347;--acc:#4f7fff;--grn:#38e8c0;--red:#ff5252;--orn:#ffb142;--txt:#eef0f8;--txt2:#8b90a8;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--txt);max-width:480px;margin:0 auto;overflow-x:hidden}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
/* TOPBAR */
.topbar{background:var(--sur);border-bottom:1px solid var(--bdr);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:16px;font-weight:700}
.topbar-sub{font-size:11px;color:var(--txt2);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:8px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:10px;font-family:'Tajawal',sans-serif;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;-webkit-appearance:none;appearance:none}
.btn:active{transform:scale(0.97)}
.btn-full{width:100%;padding:14px;font-size:16px}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-primary{background:#4f7fff;color:#fff}
.btn-success{background:#1db96a;color:#fff}
.btn-warn{background:#ffb142;color:#fff}
.btn-ghost{background:var(--sur2);color:var(--txt);border:1px solid var(--bdr)}
.btn-logout{background:none;border:1px solid var(--bdr);color:var(--txt2);padding:6px 12px;font-size:13px;border-radius:8px;font-family:'Tajawal',sans-serif;cursor:pointer}
/* TABS */
.tabs{display:flex;background:var(--sur);border-bottom:1px solid var(--bdr)}
.tab{flex:1;padding:13px 4px;text-align:center;font-size:12px;font-family:'Tajawal',sans-serif;font-weight:500;color:var(--txt2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
/* CONTENT */
.content{flex:1;padding:18px;overflow-y:auto}
/* FORMS */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--txt2);margin-bottom:5px;font-weight:500}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:10px;padding:12px 14px;color:var(--txt);font-family:'Tajawal',sans-serif;font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{border-color:var(--acc)}
.field-hint{font-size:11px;color:var(--txt2);margin-top:4px}
/* LOGIN */
#screen-login{justify-content:center;align-items:center;padding:32px 20px;background:radial-gradient(ellipse at top,#1a2040,var(--bg) 65%)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo img{width:80px;height:80px;border-radius:18px;object-fit:cover;margin-bottom:12px;display:block;margin-left:auto;margin-right:auto}
.login-logo h1{font-size:20px;font-weight:800}
.login-logo p{font-size:13px;color:var(--txt2);margin-top:3px}
.login-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:24px;width:100%;max-width:360px}
/* CARDS */
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:10px}
/* EMPLOYEE LIST */
.search-box{width:100%;background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:11px 14px;color:var(--txt);font-family:'Tajawal',sans-serif;font-size:14px;outline:none;margin-bottom:14px;-webkit-appearance:none}
.emp-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.emp-card:active{background:var(--sur2)}
.emp-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#4f7fff,#38e8c0);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex-shrink:0}
.emp-info{flex:1;min-width:0}
.emp-name{font-size:15px;font-weight:700}
.emp-iqama{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--acc);margin-top:2px}
.emp-site{font-size:11px;color:var(--txt2);margin-top:1px}
.badge{padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.badge-red{background:rgba(255,82,82,.15);border:1px solid rgba(255,82,82,.3);color:var(--red)}
.badge-grn{background:rgba(56,232,192,.1);border:1px solid rgba(56,232,192,.3);color:var(--grn)}
.badge-dim{background:var(--sur2);border:1px solid var(--bdr);color:var(--txt2)}
/* DETAIL */
.back-btn{background:none;border:none;color:var(--acc);font-size:14px;font-weight:500;cursor:pointer;padding:0;font-family:'Tajawal',sans-serif;display:flex;align-items:center;gap:6px}
.detail-name{font-size:21px;font-weight:800;margin-bottom:3px}
.detail-iqama{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--acc)}
.detail-sub{font-size:12px;color:var(--txt2);margin-top:4px;margin-bottom:16px}
/* DUES BOX */
.dues-box{background:#1a2040;border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:18px}
.dues-box h3{font-size:12px;color:var(--txt2);margin-bottom:12px}
.dues-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dues-item .lbl{font-size:10px;color:var(--txt2);margin-bottom:3px;text-align:center}
.dues-item .val{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;text-align:center}
.dues-total{border-top:1px solid var(--bdr);padding-top:12px;text-align:center}
.dues-total .lbl{font-size:12px;color:var(--txt2)}
.dues-total .amount{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:700;margin-top:3px}
/* SECTION */
.section{margin-bottom:18px}
.section h3{font-size:13px;color:var(--txt2);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--bdr)}
.info-row{background:rgba(79,127,255,.08);border:1px solid rgba(79,127,255,.2);border-radius:8px;padding:11px 13px;margin-bottom:12px;font-size:13px;line-height:1.9}
/* DASHBOARD */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:13px;text-align:center}
.stat-val{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:700;margin-bottom:3px}
.stat-lbl{font-size:10px;color:var(--txt2)}
.site-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:10px}
.dash-tbl{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden}
.dash-hdr{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;padding:9px 12px;background:var(--sur2);font-size:10px;color:var(--txt2);font-weight:600;border-bottom:1px solid var(--bdr)}
.dash-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;padding:11px 12px;border-bottom:1px solid var(--bdr);align-items:start;cursor:pointer}
.dash-row:last-child{border-bottom:none}
.dash-row:active{background:var(--sur2)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;text-align:center;margin-top:2px}
/* MONTH NAV */
.month-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:9px}
.month-nav button{background:none;border:none;color:var(--acc);font-size:22px;cursor:pointer;padding:0 6px;line-height:1}
.month-nav span{font-size:15px;font-weight:700}
/* ALERT */
.alert-box{background:rgba(255,178,66,.1);border:1px solid rgba(255,178,66,.35);border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:var(--orn);line-height:1.8}
/* SITES */
.site-item{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between}
/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:var(--sur);border-radius:20px 20px 0 0;padding:22px;width:100%;max-height:88vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.sheet-close{background:var(--sur2);border:none;color:var(--txt2);width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* TOAST */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--sur2);border:1px solid var(--bdr);border-radius:10px;padding:11px 18px;font-size:14px;z-index:999;transition:transform .25s;white-space:nowrap;max-width:88vw;text-align:center;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--grn);color:var(--grn)}
#toast.err{border-color:var(--red);color:var(--red)}
/* LOADER */
.loader{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--txt2);gap:10px;font-size:14px}
.spin{width:18px;height:18px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px 20px;color:var(--txt2);font-size:14px}
/* EXPORT ROW */
.export-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="screen-login" class="screen active">
  <div class="login-logo">
    <img src="logo.png" alt="Logo" onerror="this.style.display='none'"/>
    <h1>متتبع السلف والرواتب</h1>
    <p>Employee Advance &amp; Salary Tracker</p>
  </div>
  <div class="login-card">
    <div class="field">
      <label>اسم المستخدم / Username</label>
      <input type="text" id="inp-user" placeholder="username" autocomplete="username"/>
    </div>
    <div class="field">
      <label>كلمة المرور / Password</label>
      <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn btn-full btn-primary" id="login-btn">دخول / Login</button>
  </div>
</div>

<!-- ═══ MAIN ═══ -->
<div id="screen-main" class="screen">
  <div class="topbar">
    <div>
      <div class="topbar-title">متتبع الموظفين</div>
      <div class="topbar-sub" id="topbar-sub"></div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-sm btn-ghost" id="btn-add-emp" style="display:none">+ موظف</button>
      <button class="btn-logout" id="btn-logout">خروج</button>
    </div>
  </div>
  <div class="tabs" id="tabs-row">
    <button class="tab active" data-tab="list">الموظفون</button>
    <button class="tab" data-tab="dashboard" style="display:none">لوحة التحكم</button>
    <button class="tab" data-tab="sites" style="display:none">المواقع</button>
  </div>

  <!-- LIST -->
  <div id="tab-list" class="content">
    <input class="search-box" id="search-box" type="text" placeholder="🔍 بحث بالاسم أو الإقامة..."/>
    <div id="emp-list"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="tab-dashboard" class="content" style="display:none">
    <div class="month-nav">
      <button id="dash-prev">‹</button>
      <span id="dash-month-lbl"></span>
      <button id="dash-next">›</button>
    </div>
    <div style="margin-bottom:14px">
      <select id="dash-site-filter" style="width:100%;background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:10px 13px;color:var(--txt);font-family:'Tajawal',sans-serif;font-size:14px;outline:none">
        <option value="ALL">كل المواقع / All Sites</option>
      </select>
    </div>
    <div class="export-row">
      <button class="btn btn-sm btn-ghost" id="btn-csv">📥 CSV</button>
      <button class="btn btn-sm btn-ghost" id="btn-wa">📲 واتساب</button>
      <button class="btn btn-sm btn-ghost" id="btn-print">🖨️ طباعة</button>
    </div>
    <div id="dash-content"></div>
  </div>

  <!-- SITES -->
  <div id="tab-sites" class="content" style="display:none">
    <div class="card" style="margin-bottom:16px">
      <div class="field" style="margin-bottom:10px">
        <label>اسم الموقع الجديد / New Site</label>
        <input type="text" id="new-site-inp" placeholder="مثال: Site C"/>
      </div>
      <button class="btn btn-full btn-primary" id="btn-add-site">إضافة / Add</button>
    </div>
    <div id="sites-list"></div>
  </div>
</div>

<!-- ═══ DETAIL ═══ -->
<div id="screen-detail" class="screen">
  <div class="topbar">
    <button class="back-btn" id="btn-back">← رجوع</button>
    <button class="btn-logout" id="btn-logout2">خروج</button>
  </div>
  <div class="content" id="detail-content"></div>
</div>

<!-- ═══ ADD EMPLOYEE MODAL ═══ -->
<div class="overlay" id="modal-add">
  <div class="sheet">
    <div class="sheet-title">
      <span>إضافة موظف</span>
      <button class="sheet-close" data-close="modal-add">×</button>
    </div>
    <div class="field"><label>الاسم / Name</label><input type="text" id="ae-name" placeholder="الاسم الكامل"/></div>
    <div class="field"><label>رقم الإقامة <span style="color:var(--red)">*</span></label><input type="text" id="ae-iqama" placeholder="2xxxxxxxxx" style="font-family:'IBM Plex Mono',monospace"/></div>
    <div class="field"><label>الموقع / Site</label><select id="ae-site"><option value="">-- اختر --</option></select></div>
    <div class="field"><label>الراتب / Salary (SAR)</label><input type="number" id="ae-salary" placeholder="0"/></div>
    <button class="btn btn-full btn-primary" id="btn-save-emp">حفظ / Save</button>
  </div>
</div>

<!-- ═══ EDIT EMPLOYEE MODAL ═══ -->
<div class="overlay" id="modal-edit">
  <div class="sheet">
    <div class="sheet-title">
      <span>تعديل موظف</span>
      <button class="sheet-close" data-close="modal-edit">×</button>
    </div>
    <div style="background:rgba(79,127,255,.08);border:1px solid rgba(79,127,255,.2);border-radius:8px;padding:10px 13px;margin-bottom:14px;font-size:13px">
      🪪 <span id="ee-iqama-lbl" style="font-family:'IBM Plex Mono',monospace;color:var(--acc)"></span>
    </div>
    <div class="field"><label>الاسم / Name</label><input type="text" id="ee-name"/></div>
    <div class="field"><label>الموقع / Site</label><select id="ee-site"><option value="">-- اختر --</option></select></div>
    <div class="field"><label>الراتب / Salary (SAR)</label><input type="number" id="ee-salary"/></div>
    <button class="btn btn-full btn-warn" id="btn-save-edit">حفظ التعديل</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
const API = 'https://script.google.com/macros/s/AKfycbzl00I4qN7DILVY5GolAQxuKFRYeA8W0u15mftSJjH1GkrxENggdgZSFKI2_P54VQ2XiA/exec';

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
const S = {
  user: null, employees: [], filtered: [], sites: [],
  duesCache: {}, currentEmp: null, currentDues: null,
  dashMonth: new Date().getMonth()+1, dashYear: new Date().getFullYear(),
  dashData: null
};

const MONTHS = ['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

// ══════════════════════════════════════════
// API
// ══════════════════════════════════════════
async function call(payload) {
  try {
    const r = await fetch(API + '?payload=' + encodeURIComponent(JSON.stringify(payload)), { redirect:'follow' });
    return await r.json();
  } catch(e) { return { success:false, error:'خطأ في الشبكة' }; }
}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function sar(n) {
  return (parseFloat(n)||0).toLocaleString('en-SA',{maximumFractionDigits:0}) + ' ر.س';
}

let _toast;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type ? ' '+type : '');
  clearTimeout(_toast);
  _toast = setTimeout(() => el.className = '', 3000);
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  ['list','dashboard','sites'].forEach(t => {
    const el = document.getElementById('tab-'+t);
    if (el) el.style.display = t === name ? 'block' : 'none';
  });
  if (name === 'dashboard') loadDashboard();
  if (name === 'sites') loadSites();
}

// ══════════════════════════════════════════
// BOOT — wire all events here, NO inline onclick
// ══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {

  // Login
  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('inp-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

  // Logout
  document.getElementById('btn-logout').addEventListener('click', doLogout);
  document.getElementById('btn-logout2').addEventListener('click', doLogout);

  // Back
  document.getElementById('btn-back').addEventListener('click', () => { show('screen-main'); switchTab('list'); });

  // Add employee button
  document.getElementById('btn-add-emp').addEventListener('click', openAddModal);

  // Save employee
  document.getElementById('btn-save-emp').addEventListener('click', saveEmployee);
  document.getElementById('btn-save-edit').addEventListener('click', saveEdit);

  // Sites
  document.getElementById('btn-add-site').addEventListener('click', addSite);

  // Tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });

  // Close modals via × button
  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => closeModal(btn.dataset.close));
  });
  document.querySelectorAll('.overlay').forEach(o => {
    o.addEventListener('click', e => { if(e.target === o) o.classList.remove('open'); });
  });

  // Search
  document.getElementById('search-box').addEventListener('input', e => filterEmps(e.target.value));

  // Dashboard controls
  document.getElementById('dash-prev').addEventListener('click', () => { S.dashMonth--; if(S.dashMonth<1){S.dashMonth=12;S.dashYear--;} updateMonthLbl(); loadDashboard(); });
  document.getElementById('dash-next').addEventListener('click', () => { S.dashMonth++; if(S.dashMonth>12){S.dashMonth=1;S.dashYear++;} updateMonthLbl(); loadDashboard(); });
  document.getElementById('dash-site-filter').addEventListener('change', loadDashboard);
  document.getElementById('btn-csv').addEventListener('click', exportCSV);
  document.getElementById('btn-wa').addEventListener('click', shareWA);
  document.getElementById('btn-print').addEventListener('click', printReport);

  // PWA
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
});

// ══════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════
async function doLogin() {
  const username = document.getElementById('inp-user').value.trim();
  const password = document.getElementById('inp-pass').value;
  if (!username || !password) { toast('أدخل بيانات الدخول', 'err'); return; }
  const btn = document.getElementById('login-btn');
  btn.textContent = '...'; btn.disabled = true;

  const [loginRes, sitesRes] = await Promise.all([
    call({ action:'login', username, password }),
    call({ action:'getSites' })
  ]);

  btn.textContent = 'دخول / Login'; btn.disabled = false;

  if (!loginRes.success) { toast(loginRes.error, 'err'); return; }

  S.user  = loginRes;
  S.sites = sitesRes.success ? (sitesRes.data || []) : [];

  setupUI();
  show('screen-main');
  loadEmpsAndDues();
  toast('مرحباً ' + username + ' 👋', 'ok');
}

function doLogout() {
  S.user = null; S.employees = []; S.filtered = []; S.sites = []; S.duesCache = {};
  document.getElementById('inp-pass').value = '';
  show('screen-login');
}

function setupUI() {
  const roles = { accounts:'محاسبة', office:'مكتب', site_head:'مشرف موقع' };
  document.getElementById('topbar-sub').textContent = roles[S.user.role] || S.user.role;
  const canManage = ['office','accounts'].includes(S.user.role);
  document.getElementById('btn-add-emp').style.display = (canManage || S.user.role==='site_head') ? '' : 'none';
  // Show/hide tabs
  document.querySelector('[data-tab="dashboard"]').style.display = S.user.role==='accounts' ? '' : 'none';
  document.querySelector('[data-tab="sites"]').style.display = canManage ? '' : 'none';
  updateMonthLbl();
}

// ══════════════════════════════════════════
// EMPLOYEES
// ══════════════════════════════════════════
async function loadEmpsAndDues() {
  document.getElementById('emp-list').innerHTML = '<div class="loader"><div class="spin"></div> جار التحميل...</div>';

  const now = new Date();
  const [empRes, dashRes] = await Promise.all([
    call({ action:'getEmployees', role:S.user.role, site:S.user.site }),
    call({ action:'getFullDashboard', month:now.getMonth()+1, year:now.getFullYear(), site: S.user.role==='site_head' ? S.user.site : 'ALL' })
  ]);

  S.employees = empRes.success ? (empRes.data || []) : [];
  S.filtered  = [...S.employees];

  S.duesCache = {};
  if (dashRes.success) {
    (dashRes.summary || []).forEach(e => { S.duesCache[String(e.iqamaNo)] = e.totalDues; });
  }

  renderEmps();
}

function filterEmps(q) {
  const l = q.toLowerCase();
  S.filtered = q ? S.employees.filter(e =>
    e.Name.toLowerCase().includes(l) ||
    String(e.IqamaNo).includes(q) ||
    (e.Site||'').toLowerCase().includes(l)
  ) : [...S.employees];
  renderEmps();
}

function renderEmps() {
  const el = document.getElementById('emp-list');
  if (!S.filtered.length) { el.innerHTML='<div class="empty">لا توجد نتائج</div>'; return; }
  el.innerHTML = S.filtered.map(emp => {
    const dues = S.duesCache[String(emp.IqamaNo)];
    const bc = dues===undefined ? 'badge-dim' : dues<=0 ? 'badge-grn' : 'badge-red';
    const bt = dues===undefined ? '...' : sar(dues);
    return '<div class="emp-card" data-iqama="'+emp.IqamaNo+'">'
      + '<div class="emp-av">'+emp.Name.charAt(0)+'</div>'
      + '<div class="emp-info">'
      + '<div class="emp-name">'+emp.Name+'</div>'
      + '<div class="emp-iqama">'+emp.IqamaNo+'</div>'
      + '<div class="emp-site">'+emp.Site+'</div>'
      + '</div>'
      + '<div class="badge '+bc+'">'+bt+'</div>'
      + '</div>';
  }).join('');

  document.querySelectorAll('.emp-card').forEach(card => {
    card.addEventListener('click', () => openEmp(card.dataset.iqama));
  });
}

// ══════════════════════════════════════════
// EMPLOYEE DETAIL
// ══════════════════════════════════════════
async function openEmp(iqamaNo) {
  S.currentEmp = S.employees.find(e => String(e.IqamaNo) === String(iqamaNo));
  show('screen-detail');
  document.getElementById('detail-content').innerHTML = '<div class="loader"><div class="spin"></div> جار التحميل...</div>';

  const now = new Date();
  const res = await call({ action:'getEmployeeDues', iqamaNo, month:now.getMonth()+1, year:now.getFullYear() });
  if (!res.success) { toast(res.error,'err'); return; }
  S.currentDues = res.dues;
  renderDetail();
}

function renderDetail() {
  const emp = S.currentEmp, d = S.currentDues, role = S.user.role;
  const canAdv = ['site_head','office','accounts'].includes(role);
  const canExp = ['office','accounts'].includes(role);
  const canSal = ['site_head','office','accounts'].includes(role);
  const canEdt = ['office','accounts'].includes(role);

  const totalDues   = d.totalDues;
  const displayDues = Math.max(0, totalDues);
  const salary      = parseFloat(emp.Salary);
  const netPayable  = totalDues > 0 ? Math.max(0, salary - totalDues) : salary;
  const dClass      = totalDues > 0 ? 'var(--red)' : totalDues < 0 ? 'var(--orn)' : 'var(--grn)';

  // Month options (current + 2 previous)
  const now = new Date();
  let mOpts = '';
  for (let i=0; i<3; i++) {
    let m = now.getMonth()+1-i, y = now.getFullYear();
    if (m<=0) { m+=12; y--; }
    mOpts += '<option value="'+m+'_'+y+'"'+(i===0?' selected':'')+'>'+MONTHS[m]+' '+y+'</option>';
  }

  let html = '<div class="detail-name">'+emp.Name+'</div>'
    + '<div class="detail-iqama">🪪 '+emp.IqamaNo+'</div>'
    + '<div class="detail-sub">'+emp.Site+' · راتب: '+sar(emp.Salary)+'</div>';

  if (canEdt) html += '<button class="btn btn-sm btn-ghost" id="btn-edit-emp" style="margin-bottom:16px">✏️ تعديل</button>';

  html += '<div class="dues-box"><h3>المستحقات — '+MONTHS[d.month]+' '+d.year+'</h3>'
    + '<div class="dues-grid">'
    + '<div class="dues-item"><div class="lbl">ترحيل</div><div class="val" style="color:var(--orn)">'+sar(d.carryForward)+'</div></div>'
    + '<div class="dues-item"><div class="lbl">سلف</div><div class="val" style="color:var(--red)">'+sar(d.advances)+'</div></div>'
    + '<div class="dues-item"><div class="lbl">مصاريف</div><div class="val" style="color:var(--red)">'+sar(d.expenses)+'</div></div>'
    + '<div class="dues-item"><div class="lbl">مدفوع</div><div class="val" style="color:var(--grn)">'+sar(d.salaryPaid)+'</div></div>'
    + '</div>'
    + '<div class="dues-total"><div class="lbl">إجمالي المستحقات</div>'
    + '<div class="amount" style="color:'+dClass+'">'+sar(displayDues)+'</div>'
    + (totalDues<0 ? '<div style="font-size:12px;color:var(--orn);margin-top:4px">رصيد للموظف / Credit</div>' : '')
    + '</div></div>';

  if (canAdv) html += '<div class="section"><h3>➕ إضافة سلفة / Advance</h3>'
    + '<div class="card"><div class="field"><label>المبلغ (SAR)</label><input type="number" id="adv-amt" placeholder="0"/></div>'
    + '<div class="field"><label>ملاحظات</label><input type="text" id="adv-note" placeholder="اختياري"/></div>'
    + '<button class="btn btn-full btn-primary" id="btn-adv">حفظ السلفة</button></div></div>';

  if (canExp) html += '<div class="section"><h3>📄 إضافة مصروف / Expense</h3>'
    + '<div class="card"><div class="field"><label>المبلغ (SAR)</label><input type="number" id="exp-amt" placeholder="0"/></div>'
    + '<div class="field"><label>ملاحظات</label><input type="text" id="exp-note" placeholder="نوع المصروف"/></div>'
    + '<button class="btn btn-full btn-success" id="btn-exp">حفظ المصروف</button></div></div>';

  if (canSal) html += '<div class="section"><h3>💰 صرف راتب / Salary</h3>'
    + '<div class="card"><div class="info-row">'
    + 'الراتب: <strong>'+sar(salary)+'</strong><br>'
    + 'المستحقات: <strong style="color:var(--red)">'+sar(displayDues)+'</strong><br>'
    + '<span style="border-top:1px solid rgba(79,127,255,.2);display:block;margin-top:6px;padding-top:6px">'
    + 'صافي للموظف: <strong style="color:var(--grn);font-size:15px">'+sar(netPayable)+'</strong></span></div>'
    + '<div class="field"><label>الشهر</label><select id="sal-month">'+mOpts+'</select></div>'
    + '<div class="field"><label>المبلغ المدفوع (SAR)</label>'
    + '<input type="number" id="sal-amt" value="'+netPayable+'"/>'
    + '<div class="field-hint">المقترح = الراتب − المستحقات</div></div>'
    + '<button class="btn btn-full btn-success" id="btn-sal">تأكيد الصرف</button></div></div>';

  document.getElementById('detail-content').innerHTML = html;

  // Wire buttons (no inline onclick)
  if (canEdt) document.getElementById('btn-edit-emp').addEventListener('click', openEditModal);
  if (canAdv) document.getElementById('btn-adv').addEventListener('click', saveAdvance);
  if (canExp) document.getElementById('btn-exp').addEventListener('click', saveExpense);
  if (canSal) document.getElementById('btn-sal').addEventListener('click', saveSalary);
}

async function saveAdvance() {
  const amt = parseFloat(document.getElementById('adv-amt').value);
  if (!amt||amt<=0) { toast('أدخل مبلغاً صحيحاً','err'); return; }
  const res = await call({ action:'addAdvance', iqamaNo:S.currentEmp.IqamaNo, amount:amt, notes:document.getElementById('adv-note').value, addedBy:S.user.username });
  if (res.success) { toast('تم ✓','ok'); openEmp(S.currentEmp.IqamaNo); }
  else toast(res.error,'err');
}

async function saveExpense() {
  const amt = parseFloat(document.getElementById('exp-amt').value);
  if (!amt||amt<=0) { toast('أدخل مبلغاً صحيحاً','err'); return; }
  const res = await call({ action:'addExpense', iqamaNo:S.currentEmp.IqamaNo, amount:amt, notes:document.getElementById('exp-note').value, addedBy:S.user.username });
  if (res.success) { toast('تم ✓','ok'); openEmp(S.currentEmp.IqamaNo); }
  else toast(res.error,'err');
}

async function saveSalary() {
  const amt = parseFloat(document.getElementById('sal-amt').value);
  if (!amt||amt<=0) { toast('أدخل مبلغاً صحيحاً','err'); return; }
  const [m,y] = document.getElementById('sal-month').value.split('_');
  const res = await call({ action:'addSalaryPayment', iqamaNo:S.currentEmp.IqamaNo, amountPaid:amt, month:parseInt(m), year:parseInt(y), processedBy:S.user.username });
  if (res.success) { toast('تم الصرف ✓','ok'); openEmp(S.currentEmp.IqamaNo); }
  else toast(res.error,'err');
}

function fillSiteDropdown(selectId, selectedVal) {
  const el = document.getElementById(selectId);
  const sites = S.user.role==='site_head' ? [S.user.site] : S.sites;
  el.innerHTML = '<option value="">-- اختر --</option>' + sites.map(s => '<option value="'+s+'"'+(s===selectedVal?' selected':'')+'>'+s+'</option>').join('');
  if (S.user.role==='site_head') { el.value=S.user.site; el.disabled=true; } else { el.disabled=false; }
}

function openAddModal() {
  ['ae-name','ae-iqama','ae-salary'].forEach(id => document.getElementById(id).value='');
  fillSiteDropdown('ae-site', '');
  openModal('modal-add');
}

async function saveEmployee() {
  const name=document.getElementById('ae-name').value.trim();
  const iqama=document.getElementById('ae-iqama').value.trim();
  const site=document.getElementById('ae-site').value;
  const salary=parseFloat(document.getElementById('ae-salary').value);
  if (!name||!iqama||!site||!salary) { toast('أكمل جميع الحقول','err'); return; }
  const res = await call({ action:'addEmployee', name, iqamaNo:iqama, site, salary });
  if (res.success) { toast('تم إضافة الموظف ✓','ok'); closeModal('modal-add'); loadEmpsAndDues(); }
  else toast(res.error,'err');
}

function openEditModal() {
  const emp = S.currentEmp;
  document.getElementById('ee-iqama-lbl').textContent = emp.IqamaNo;
  document.getElementById('ee-name').value   = emp.Name;
  document.getElementById('ee-salary').value = emp.Salary;
  fillSiteDropdown('ee-site', emp.Site);
  openModal('modal-edit');
}

async function saveEdit() {
  const name=document.getElementById('ee-name').value.trim();
  const site=document.getElementById('ee-site').value;
  const salary=parseFloat(document.getElementById('ee-salary').value);
  if (!name||!site||!salary) { toast('أكمل جميع الحقول','err'); return; }
  const res = await call({ action:'editEmployee', iqamaNo:S.currentEmp.IqamaNo, name, site, salary });
  if (res.success) {
    toast('تم التعديل ✓','ok');
    closeModal('modal-edit');
    S.currentEmp = { ...S.currentEmp, Name:name, Site:site, Salary:salary };
    loadEmpsAndDues();
    openEmp(S.currentEmp.IqamaNo);
  } else toast(res.error,'err');
}

async function loadSites() {
  document.getElementById('sites-list').innerHTML = '<div class="loader"><div class="spin"></div></div>';
  const res = await call({ action:'getSites' });
  if (!res.success) { toast(res.error,'err'); return; }
  S.sites = res.data || [];
  fillSiteDropdown('ae-site',''); fillSiteDropdown('ee-site','');
  if (!S.sites.length) { document.getElementById('sites-list').innerHTML='<div class="empty">لا توجد مواقع بعد</div>'; return; }
  document.getElementById('sites-list').innerHTML = S.sites.map(s =>
    '<div class="site-item"><span style="font-size:15px;font-weight:600">🏗 '+s+'</span>'
    + '<button class="btn btn-sm btn-ghost" data-site="'+s+'" style="color:var(--red);border-color:var(--red)">حذف</button></div>'
  ).join('');
  document.querySelectorAll('[data-site]').forEach(btn => {
    btn.addEventListener('click', () => deleteSite(btn.dataset.site));
  });
}

async function addSite() {
  const name = document.getElementById('new-site-inp').value.trim();
  if (!name) { toast('أدخل اسم الموقع','err'); return; }
  const res = await call({ action:'addSite', siteName:name });
  if (res.success) { toast('تم ✓','ok'); document.getElementById('new-site-inp').value=''; S.sites.push(name); loadSites(); }
  else toast(res.error,'err');
}

async function deleteSite(name) {
  if (!confirm('حذف موقع "'+name+'"؟')) return;
  const res = await call({ action:'deleteSite', siteName:name });
  if (res.success) { toast('تم الحذف ✓','ok'); S.sites=S.sites.filter(s=>s!==name); loadSites(); }
  else toast(res.error,'err');
}

// DASHBOARD
// ══════════════════════════════════════════
function updateMonthLbl() {
  const el = document.getElementById('dash-month-lbl');
  if (el) el.textContent = MONTHS[S.dashMonth]+' '+S.dashYear;
}

async function loadDashboard() {
  document.getElementById('dash-content').innerHTML = '<div class="loader"><div class="spin"></div> جار التحميل...</div>';
  const site = document.getElementById('dash-site-filter').value;
  const res = await call({ action:'getFullDashboard', month:S.dashMonth, year:S.dashYear, site });
  if (!res.success) { toast(res.error,'err'); return; }
  S.dashData = res;
  const st = res.stats;

  // Rebuild site filter
  const sites = [...new Set(res.summary.map(e=>e.site))].filter(Boolean);
  const sf = document.getElementById('dash-site-filter');
  const cur = sf.value;
  sf.innerHTML = '<option value="ALL">كل المواقع</option>' + sites.map(s=>'<option value="'+s+'"'+(s===cur?' selected':'')+'>'+s+'</option>').join('');

  // Alerts
  let alertHtml = '';
  if (st.unpaidCount>0 || st.riskCount>0) {
    alertHtml = '<div class="alert-box">';
    if (st.unpaidCount>0) alertHtml += '⚠️ '+st.unpaidCount+' موظف لم يُصرف راتبه هذا الشهر<br>';
    if (st.riskCount>0)   alertHtml += '🚨 '+st.riskCount+' موظف مستحقاته تتجاوز راتبه';
    alertHtml += '</div>';
  }

  // Stats
  const statsHtml = '<div class="stat-grid">'
    + '<div class="stat-card"><div class="stat-val">'+st.totalEmployees+'</div><div class="stat-lbl">الموظفون</div></div>'
    + '<div class="stat-card"><div class="stat-val" style="color:var(--red)">'+st.withDues+'</div><div class="stat-lbl">عليهم مستحقات</div></div>'
    + '<div class="stat-card"><div class="stat-val" style="color:var(--orn);font-size:13px">'+sar(st.totalOutstanding)+'</div><div class="stat-lbl">إجمالي المستحقات</div></div>'
    + '<div class="stat-card"><div class="stat-val" style="color:var(--grn);font-size:13px">'+sar(st.totalSalaryPaid)+'</div><div class="stat-lbl">إجمالي المصروف</div></div>'
    + '<div class="stat-card"><div class="stat-val" style="color:var(--red);font-size:13px">'+sar(st.totalAdvances)+'</div><div class="stat-lbl">السلف</div></div>'
    + '<div class="stat-card"><div class="stat-val" style="color:var(--red);font-size:13px">'+sar(st.totalExpenses)+'</div><div class="stat-lbl">المصاريف</div></div>'
    + '</div>';

  // Site cards
  let siteHtml = '';
  if (res.siteSummary && res.siteSummary.length > 1) {
    siteHtml = '<div style="font-size:13px;color:var(--txt2);margin-bottom:10px;font-weight:600">ملخص المواقع</div>';
    siteHtml += res.siteSummary.map(s =>
      '<div class="site-card">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
      + '<span style="font-size:14px;font-weight:700">🏗 '+s.site+'</span>'
      + '<span style="font-size:11px;color:var(--txt2)">'+s.totalEmployees+' موظف</span></div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">'
      + '<div><div style="font-size:10px;color:var(--txt2)">مستحقات</div><div style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--red);font-weight:700">'+sar(s.totalDues)+'</div></div>'
      + '<div><div style="font-size:10px;color:var(--txt2)">سلف</div><div style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--orn)">'+sar(s.totalAdvances)+'</div></div>'
      + '<div><div style="font-size:10px;color:var(--txt2)">مصاريف</div><div style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--orn)">'+sar(s.totalExpenses)+'</div></div>'
      + '</div>'
      + (s.unpaidCount>0 ? '<div style="margin-top:8px;font-size:11px;color:var(--orn)">⚠️ '+s.unpaidCount+' لم يُصرف راتبه</div>' : '')
      + (s.riskCount>0   ? '<div style="margin-top:3px;font-size:11px;color:var(--red)">🚨 '+s.riskCount+' تجاوز راتبه</div>' : '')
      + '</div>'
    ).join('');
  }

  // Employee table
  let tblHtml = '<div style="font-size:13px;color:var(--txt2);margin-bottom:10px;font-weight:600">تفاصيل الموظفين</div><div class="dash-tbl">'
    + '<div class="dash-hdr"><div>الموظف</div><div style="text-align:center">سلف</div><div style="text-align:center">مصاريف</div><div style="text-align:center">صافي</div></div>';

  tblHtml += res.summary.map(e => {
    const flags = (e.unpaidThisMonth ? '⚠️ ' : '') + (e.duesExceedSalary ? '🚨 ' : '') + (e.carryForward>0 ? '↩ ' : '');
    const trend = e.totalDues > e.prevDues ? '📈' : e.totalDues < e.prevDues ? '📉' : '';
    return '<div class="dash-row" data-iqama="'+e.iqamaNo+'">'
      + '<div><div style="font-size:13px;font-weight:700">'+e.name+' '+trend+'</div>'
      + '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:var(--acc)">'+e.iqamaNo+'</div>'
      + '<div style="font-size:10px;color:var(--txt2)">'+e.site+'</div>'
      + (flags ? '<div style="font-size:10px;margin-top:3px">'+flags+'</div>' : '')
      + '</div>'
      + '<div class="mono" style="color:var(--orn)">'+sar(e.advances)+'</div>'
      + '<div class="mono" style="color:var(--orn)">'+sar(e.expenses)+'</div>'
      + '<div class="mono" style="color:'+(e.totalDues>0?'var(--red)':'var(--grn)')+'">'+sar(Math.max(0,e.totalDues))+'</div>'
      + '</div>';
  }).join('');
  tblHtml += '</div>';

  document.getElementById('dash-content').innerHTML = alertHtml + statsHtml + siteHtml + tblHtml;

  document.querySelectorAll('.dash-row[data-iqama]').forEach(row => {
    row.addEventListener('click', () => openEmp(row.dataset.iqama));
  });
}

// ══════════════════════════════════════════
// EXPORT / SHARE / PRINT
// ══════════════════════════════════════════
function exportCSV() {
  if (!S.dashData) { toast('افتح لوحة التحكم أولاً','err'); return; }
  const d = S.dashData;
  const rows = [['الاسم','الاقامة','الموقع','الراتب','ترحيل','سلف','مصاريف','مدفوع','المستحقات']];
  d.summary.forEach(e => rows.push([e.name,e.iqamaNo,e.site,e.salary,e.carryForward,e.advances,e.expenses,e.salaryPaid,Math.max(0,e.totalDues)]));
  const csv = '\uFEFF' + rows.map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = 'dues-'+d.year+'-'+d.month+'.csv';
  a.click();
  toast('تم التصدير ✓','ok');
}

function shareWA() {
  if (!S.dashData) { toast('افتح لوحة التحكم أولاً','err'); return; }
  const d = S.dashData, st = d.stats;
  let msg = '*تقرير المستحقات — '+MONTHS[d.month]+' '+d.year+'*\n\n';
  msg += '👥 الموظفون: '+st.totalEmployees+'\n';
  msg += '💰 إجمالي المستحقات: '+sar(st.totalOutstanding)+'\n';
  msg += '✅ إجمالي المصروف: '+sar(st.totalSalaryPaid)+'\n';
  if(st.unpaidCount>0) msg += '⚠️ لم يُصرف راتبهم: '+st.unpaidCount+'\n';
  if(st.riskCount>0)   msg += '🚨 تجاوزت مستحقاتهم راتبهم: '+st.riskCount+'\n';
  if(d.siteSummary && d.siteSummary.length) {
    msg += '\n*المواقع:*\n';
    d.siteSummary.forEach(s => { msg += '\n🏗 '+s.site+' ('+s.totalEmployees+' موظف)\nمستحقات: '+sar(s.totalDues)+'\n'; });
  }
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function printReport() {
  if (!S.dashData) { toast('افتح لوحة التحكم أولاً','err'); return; }
  const d = S.dashData, st = d.stats;
  const rows = d.summary.map(e =>
    '<tr><td>'+e.name+'</td><td>'+e.iqamaNo+'</td><td>'+e.site+'</td>'
    +'<td>'+sar(e.carryForward)+'</td><td>'+sar(e.advances)+'</td>'
    +'<td>'+sar(e.expenses)+'</td><td>'+sar(e.salaryPaid)+'</td>'
    +'<td><b>'+sar(Math.max(0,e.totalDues))+'</b></td></tr>'
  ).join('');
  const w = window.open('','_blank');
  w.document.write('<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8">'
    +'<title>تقرير '+MONTHS[d.month]+' '+d.year+'</title>'
    +'<style>body{font-family:Arial,sans-serif;padding:20px;font-size:12px}'
    +'table{width:100%;border-collapse:collapse;margin-top:12px}'
    +'th{background:#333;color:#fff;padding:7px;text-align:right}'
    +'td{padding:6px 7px;border-bottom:1px solid #eee}'
    +'tr:nth-child(even){background:#fafafa}'
    +'h2{font-size:15px}.row{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}'
    +'.s{background:#f5f5f5;padding:7px 14px;border-radius:6px;font-size:12px}'
    +'</style></head><body>'
    +'<h2>تقرير المستحقات — '+MONTHS[d.month]+' '+d.year+'</h2>'
    +'<div class="row">'
    +'<div class="s">الموظفون: <b>'+st.totalEmployees+'</b></div>'
    +'<div class="s">إجمالي المستحقات: <b>'+sar(st.totalOutstanding)+'</b></div>'
    +'<div class="s">إجمالي المصروف: <b>'+sar(st.totalSalaryPaid)+'</b></div>'
    +'<div class="s">السلف: <b>'+sar(st.totalAdvances)+'</b></div>'
    +'<div class="s">المصاريف: <b>'+sar(st.totalExpenses)+'</b></div>'
    +'</div>'
    +'<table><tr><th>الاسم</th><th>الإقامة</th><th>الموقع</th><th>ترحيل</th><th>سلف</th><th>مصاريف</th><th>مدفوع</th><th>المستحقات</th></tr>'
    +rows+'</table>'
    +'<script>window.onload=function(){window.print();}<\/script>'
    +'</body></html>');
  w.document.close();
}
</script>
</body>
</html>
